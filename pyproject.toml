[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ollama-speak"
version = "1.1.0"
description = "100% Local, Offline Multilingual Neural Text-to-Speech CLI for Ollama (Kokoro-82M & Piper)."
readme = "README.md"
authors = [
    { name = "Ajarn Spencer Littlewood", email = "ajarnspencer@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "kokoro>=0.8.4",
    "soundfile>=0.12.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
piper = [
    "piper-tts>=1.2.0",
]
all = [
    "kokoro>=0.8.4",
    "piper-tts>=1.2.0",
    "soundfile>=0.12.0",
]

[project.scripts]
ollama-speak = "ollama_speak.cli:main"
ospeak = "ollama_speak.cli:main"

[project.urls]
Homepage = "https://github.com/AjarnSpencer/ollama-speak"
Repository = "https://github.com/AjarnSpencer/ollama-speak"
Issues = "https://github.com/AjarnSpencer/ollama-speak/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_speak"]
