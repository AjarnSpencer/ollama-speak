[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ollama-speak"
version = "1.0.0"
description = "Universal multilingual neural text-to-speech CLI and pipe companion for Ollama models on Linux, macOS, and Windows."
readme = "README.md"
authors = [
    { name = "Cicada & Antigravity Community", email = "dev@cicada.local" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "edge-tts>=7.0.0",
]

[project.scripts]
ollama-speak = "ollama_speak.cli:main"
ospeak = "ollama_speak.cli:main"

[project.urls]
Homepage = "https://github.com/AjarnSpencer/ollama-speak"
Repository = "https://github.com/AjarnSpencer/ollama-speak"
Issues = "https://github.com/AjarnSpencer/ollama-speak/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_speak"]
